<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI 工作台 · Knowledge OS for Agents</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="pipeline.css" />
</head>
<body>
  <!-- 极光背景 -->
  <div class="aurora" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
  </div>

  <div class="app">
    <!-- 侧边导航 -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 28 28" fill="none" aria-hidden="true">
          <path d="M14 2L25 8V20L14 26L3 20V8L14 2Z" stroke="#2EA7FF" stroke-width="2"/>
          <circle cx="14" cy="14" r="4" fill="#9381FF"/>
        </svg>
        <div class="brand-text">
          <strong>AI 工作台</strong>
          <span>Agent · 知识 · 具身</span>
        </div>
      </div>

      <nav class="nav" id="nav" aria-label="主导航">
        <p class="nav-label">工作区</p>
        <button class="nav-item is-active" data-view="overview">
          <svg viewBox="0 0 18 18" fill="none"><rect x="2" y="2" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.6"/><rect x="10" y="2" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.6"/><rect x="2" y="10" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.6"/><rect x="10" y="10" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.6"/></svg>
          <span>总览</span>
        </button>
        <button class="nav-item" data-view="runs">
          <svg viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="2.2" stroke="currentColor" stroke-width="1.6"/><circle cx="3.2" cy="4.2" r="1.8" stroke="currentColor" stroke-width="1.5"/><circle cx="14.8" cy="4.2" r="1.8" stroke="currentColor" stroke-width="1.5"/><circle cx="3.2" cy="13.8" r="1.8" stroke="currentColor" stroke-width="1.5"/><circle cx="14.8" cy="13.8" r="1.8" stroke="currentColor" stroke-width="1.5"/><path d="M7.4 7.6L4.5 5.2M10.6 7.6L13.5 5.2M7.4 10.4L4.5 12.8M10.6 10.4L13.5 12.8" stroke="currentColor" stroke-width="1.4"/></svg>
          <span>协作监控</span>
          <em class="nav-badge" id="badge-runs">2</em>
        </button>
        <p class="nav-label">协作流水线</p>
        <button class="nav-item" data-view="plan">
          <svg viewBox="0 0 18 18" fill="none"><path d="M3 4h5v3H3zM10 11h5v3h-5zM3 11h4v3H3z" stroke="currentColor" stroke-width="1.5"/><path d="M5.5 7v4M12.5 11V8.5H8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          <span>任务拆分</span>
        </button>
        <button class="nav-item" data-view="board">
          <svg viewBox="0 0 18 18" fill="none"><rect x="2" y="3" width="3.4" height="12" rx="1" stroke="currentColor" stroke-width="1.4"/><rect x="7.3" y="3" width="3.4" height="7.5" rx="1" stroke="currentColor" stroke-width="1.4"/><rect x="12.6" y="3" width="3.4" height="9.5" rx="1" stroke="currentColor" stroke-width="1.4"/></svg>
          <span>执行看板</span>
        </button>
        <button class="nav-item" data-view="feedback">
          <svg viewBox="0 0 18 18" fill="none"><path d="M3 4h12v7H8l-3.5 3V11H3z" stroke="currentColor" stroke-width="1.5"/><path d="M6 7h6M6 9h4" stroke="#FFB454" stroke-width="1.3" stroke-linecap="round"/></svg>
          <span>反馈闭环</span>
          <em class="nav-badge" id="badge-gate" style="display:none">0</em>
        </button>

        <p class="nav-label">工作区</p>
        <button class="nav-item" data-view="agents">
          <svg viewBox="0 0 18 18" fill="none"><circle cx="9" cy="4" r="2.5" stroke="currentColor" stroke-width="1.6"/><circle cx="4" cy="14" r="2.5" stroke="currentColor" stroke-width="1.6"/><circle cx="14" cy="14" r="2.5" stroke="currentColor" stroke-width="1.6"/><path d="M9 6.5V9M9 9L5.5 12M9 9L12.5 12" stroke="currentColor" stroke-width="1.6"/></svg>
          <span>Agent 编排</span>
          <em class="nav-badge" id="badge-agents">4</em>
        </button>
        <button class="nav-item" data-view="apps">
          <svg viewBox="0 0 18 18" fill="none"><rect x="2" y="2" width="14" height="14" rx="3" stroke="currentColor" stroke-width="1.6"/><path d="M6 11L8 8L10 10L12 6.5" stroke="#13DDC4" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span>AI 应用</span>
        </button>
        <button class="nav-item" data-view="knowledge">
          <svg viewBox="0 0 18 18" fill="none"><path d="M9 2L15 5V13L9 16L3 13V5L9 2Z" stroke="currentColor" stroke-width="1.6"/><path d="M9 8.5L15 5M9 8.5L3 5M9 8.5V16" stroke="currentColor" stroke-width="1.6"/></svg>
          <span>知识库</span>
        </button>
        <button class="nav-item" data-view="models">
          <svg viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="6.5" stroke="currentColor" stroke-width="1.6"/><circle cx="9" cy="9" r="2.5" fill="#9381FF"/></svg>
          <span>模型中心</span>
        </button>
      </nav>

      <div class="sidebar-foot">
        <button class="user-row" id="userBtn">
          <span class="avatar">LLW</span>
          <span class="user-meta">
            <strong>李良伟</strong>
            <small>Personal workspace</small>
          </span>
        </button>
      </div>
    </aside>

    <!-- 主区域 -->
    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <h1 class="page-title" id="pageTitle">总览</h1>
          <span class="page-sub" id="pageSub">采集归档 / 运行监控 / 知识回流</span>
        </div>

        <div class="topbar-right">
          <button class="search-pill" id="searchPill" aria-label="打开命令面板">
            <svg viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.6"/><path d="M11 11L14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            <span>搜索或输入命令</span>
            <kbd>Ctrl K</kbd>
          </button>

          <button class="pill ghost" id="modelPill">
            <i class="dot dot-teal"></i>
            <span>deepseek-v4-flash（默认）</span>
          </button>

          <button class="pill primary" id="ctaBtn">
            <svg viewBox="0 0 14 14" fill="none"><path d="M7 2V12M2 7H12" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
            <span>新建 Agent</span>
          </button>
        </div>
      </header>

      <div class="content" id="content"><!-- 视图渲染 --></div>
    </main>
  </div>

  <!-- 命令面板 -->
  <div class="palette-overlay" id="palette" hidden>
    <div class="palette" role="dialog" aria-modal="true" aria-label="命令面板">
      <div class="palette-input">
        <svg viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.6"/><path d="M11 11L14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <input id="paletteInput" type="text" placeholder="跳转页面、运行命令、搜索任务…" autocomplete="off" />
        <kbd>ESC</kbd>
      </div>
      <div class="palette-list" id="paletteList"></div>
      <div class="palette-foot">
        <span><kbd>↑↓</kbd> 选择</span>
        <span><kbd>↵</kbd> 执行</span>
        <span><kbd>Ctrl K</kbd> 关闭</span>
      </div>
    </div>
  </div>

  <!-- 右侧抽屉 -->
  <div class="drawer-overlay" id="drawerOverlay" hidden>
    <aside class="drawer" id="drawer" aria-label="详情"></aside>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="data.js"></script>
  <script src="pipeline.js"></script>
  <script src="app.js"></script>
</body>
</html>
